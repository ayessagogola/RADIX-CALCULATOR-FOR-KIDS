<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Notepad - Base Arithmetic</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Gaegu:wght@400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Fredoka', sans-serif;
            color: #2d3748;
        }

        /* Grid / Graph Paper Background Effect */
        .grid-notebook-page {
            background: #ffffff;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-left: 3px solid #3b82f6;
            position: relative;
        }

        .spiral-binding {
            position: absolute;
            top: 20px;
            left: -18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .ring {
            width: 32px;
            height: 14px;
            background: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%);
            border-radius: 10px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        input, select {
            border: 2px dashed #94a3b8 !important;
            background-color: #f0fdf4 !important;
            color: #1e293b !important;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none !important;
            border-color: #10b981 !important;
            border-style: solid !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2) !important;
        }

        .op-btn {
            transition: all 0.15s ease;
        }
        .op-btn.active-op {
            background-color: #10b981 !important;
            color: white !important;
            border-color: #047857 !important;
            transform: scale(1.05);
        }

        /* Long Division Visual Styling */
        .long-div-table {
            font-family: monospace;
            border-collapse: collapse;
            line-height: 1.25;
            margin: 0 auto;
        }
        .long-div-table td {
            padding: 2px 6px;
            text-align: center;
            font-weight: 700;
        }
        .div-roof { border-top: 2px solid #059669; }
        .div-bracket { border-left: 2px solid #059669; border-top-left-radius: 4px; }
        .minus-line { border-bottom: 2px dashed #64748b; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6">

    <div class="max-w-5xl mx-auto">
        <!-- Navigation Tabs -->
        <div class="flex items-center gap-3 ml-6 mb-[-2px] relative z-20">
            <a href="page1_converter.html" class="bg-slate-200 border-2 border-b-0 border-slate-300 px-6 py-3 rounded-t-2xl font-bold text-slate-600 hover:bg-slate-100 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-pencil text-amber-500"></i> Page 1: Base Converter
            </a>
            <a href="page2_arithmetic.html" class="bg-white border-2 border-b-0 border-slate-300 px-6 py-3 rounded-t-2xl font-bold text-emerald-600 shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-calculator text-emerald-500"></i> Page 2: Math Solver
            </a>
        </div>

        <!-- Notebook Page Content -->
        <div class="grid-notebook-page rounded-2xl rounded-tl-none p-6 md:p-10 pl-10 md:pl-16 border-2 border-slate-300">
            
            <div class="spiral-binding hidden sm:flex">
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
            </div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b-2 border-emerald-200 pb-4 mb-6 gap-4">
                <div>
                    <span class="inline-block bg-emerald-200 text-emerald-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-1">
                        📐 Math Lab Work
                    </span>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 flex items-center gap-3">
                        Any-Base Arithmetic Solver ➕➖
                    </h1>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left Column: Controls -->
                <div class="lg:col-span-5 space-y-6">
                    <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5 space-y-4">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label for="arithSourceBase" class="block text-xs font-bold text-emerald-900 mb-1">Input Base:</label>
                                <select id="arithSourceBase" class="w-full px-3 py-2 rounded-xl text-sm font-bold text-slate-700"></select>
                            </div>
                            <div>
                                <label for="arithTargetBase" class="block text-xs font-bold text-emerald-900 mb-1">Answer Base:</label>
                                <select id="arithTargetBase" class="w-full px-3 py-2 rounded-xl text-sm font-bold text-slate-700"></select>
                            </div>
                        </div>

                        <!-- First Operand -->
                        <div>
                            <label for="operand1" class="block text-xs font-bold text-slate-700 mb-1">First Number (Top / Dividend):</label>
                            <input type="text" id="operand1" value="1101" class="w-full px-4 py-2.5 rounded-xl font-mono text-lg text-slate-800">
                        </div>

                        <!-- Operators -->
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Choose Operation:</label>
                            <div class="grid grid-cols-4 gap-2">
                                <button class="op-btn bg-white border-2 border-emerald-400 py-2 rounded-xl font-extrabold text-lg text-emerald-700" data-op="+">+</button>
                                <button class="op-btn bg-white border-2 border-emerald-400 py-2 rounded-xl font-extrabold text-lg text-emerald-700" data-op="-">−</button>
                                <button class="op-btn bg-white border-2 border-emerald-400 py-2 rounded-xl font-extrabold text-lg text-emerald-700" data-op="*">×</button>
                                <button class="op-btn active-op bg-white border-2 border-emerald-400 py-2 rounded-xl font-extrabold text-lg text-emerald-700" data-op="/">÷</button>
                            </div>
                        </div>

                        <!-- Second Operand -->
                        <div>
                            <label for="operand2" class="block text-xs font-bold text-slate-700 mb-1">Second Number (Bottom / Divisor):</label>
                            <input type="text" id="operand2" value="11" class="w-full px-4 py-2.5 rounded-xl font-mono text-lg text-slate-800">
                        </div>

                    </div>

                    <!-- Result Box -->
                    <div class="bg-blue-50 border-2 border-blue-300 rounded-2xl p-5 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-blue-900 uppercase">🎯 Result Answer:</span>
                            <span id="arithTargetRadixBadge" class="bg-blue-200 text-blue-900 font-bold text-xs px-2.5 py-0.5 rounded-full">Base 2</span>
                        </div>
                        <div class="bg-white border-2 border-blue-200 rounded-xl p-4 flex items-center justify-between">
                            <div>
                                <div id="arithResultValue" class="font-mono text-2xl font-extrabold text-blue-600 break-all">--</div>
                                <div id="arithDecEquivalent" class="text-xs font-bold text-slate-500 mt-1">Decimal: --</div>
                            </div>
                            <button id="copyArithResultBtn" class="bg-blue-500 hover:bg-blue-600 text-white p-2.5 rounded-lg text-xs" title="Copy Answer">
                                <i class="fa-regular fa-copy text-base"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Visual Worksheets -->
                <div class="lg:col-span-7 space-y-6">
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 space-y-4">
                        <div class="flex items-center justify-between border-b border-amber-200 pb-2">
                            <h3 id="solutionPanelTitle" class="font-bold text-amber-900 text-sm flex items-center gap-2">
                                📝 Vertical Column Alignment
                            </h3>
                            <span id="matrixBaseLabel" class="text-xs font-bold bg-amber-200 text-amber-900 px-2.5 py-0.5 rounded-full">Base 2</span>
                        </div>

                        <!-- Vertical Alignment Box -->
                        <div id="twoLayerArithmeticBox" class="p-4 rounded-xl bg-white border border-amber-200 font-mono text-sm overflow-x-auto"></div>

                        <!-- Division Box -->
                        <div id="arithLongDivBox" class="hidden p-4 rounded-xl bg-white border border-amber-200 font-mono text-sm overflow-x-auto space-y-4"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const RADIX_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const arithSourceBase = document.getElementById('arithSourceBase');
        const arithTargetBase = document.getElementById('arithTargetBase');
        const operand1 = document.getElementById('operand1');
        const operand2 = document.getElementById('operand2');
        const arithResultValue = document.getElementById('arithResultValue');
        const arithDecEquivalent = document.getElementById('arithDecEquivalent');
        const arithTargetRadixBadge = document.getElementById('arithTargetRadixBadge');
        const copyArithResultBtn = document.getElementById('copyArithResultBtn');
        const twoLayerArithmeticBox = document.getElementById('twoLayerArithmeticBox');
        const arithLongDivBox = document.getElementById('arithLongDivBox');
        const matrixBaseLabel = document.getElementById('matrixBaseLabel');
        const solutionPanelTitle = document.getElementById('solutionPanelTitle');
        let selectedOperator = '/';

        function initBaseOptions() {
            for (let b = 2; b <= 36; b++) {
                let label = `Base ${b}`;
                if (b === 2) label += " (Binary)";
                else if (b === 8) label += " (Octal)";
                else if (b === 10) label += " (Decimal)";
                else if (b === 16) label += " (Hexadecimal)";

                arithSourceBase.add(new Option(label, b));
                arithTargetBase.add(new Option(label, b));
            }
            arithSourceBase.value = 2;
            arithTargetBase.value = 2;
        }

        function isValidRadixNumber(str, base) {
            if (!str) return true;
            const clean = str.trim().toUpperCase();
            const allowedDigits = RADIX_CHARS.slice(0, base);
            let dotCount = 0;
            for (let i = 0; i < clean.length; i++) {
                if (clean[i] === '.') {
                    dotCount++;
                    if (dotCount > 1) return false;
                } else if (!allowedDigits.includes(clean[i])) return false;
            }
            return true;
        }

        function parseToDecimal(str, base) {
            if (!str) return 0;
            const clean = str.trim().toUpperCase();
            const parts = clean.split('.');
            let intPart = parts[0] || '0';
            let fracPart = parts[1] || '';

            let intVal = 0;
            for (let i = 0; i < intPart.length; i++) {
                intVal = intVal * base + RADIX_CHARS.indexOf(intPart[i]);
            }

            let fracVal = 0;
            for (let i = fracPart.length - 1; i >= 0; i--) {
                fracVal = (fracVal + RADIX_CHARS.indexOf(fracPart[i])) / base;
            }

            return intVal + fracVal;
        }

        function decimalToTargetBase(decimalValue, targetBaseVal, maxFracDigits = 6) {
            if (isNaN(decimalValue)) return "0";
            let val = Math.abs(decimalValue);
            let intPart = Math.floor(val);
            let fracPart = val - intPart;

            let intStr = "";
            if (intPart === 0) intStr = "0";
            else {
                let temp = intPart;
                while (temp > 0) {
                    intStr = RADIX_CHARS[temp % targetBaseVal] + intStr;
                    temp = Math.floor(temp / targetBaseVal);
                }
            }

            let fracStr = "";
            let count = 0;
            let fracTemp = fracPart;
            while (fracTemp > 0 && count < maxFracDigits) {
                fracTemp *= targetBaseVal;
                let digit = Math.floor(fracTemp);
                fracStr += RADIX_CHARS[digit];
                fracTemp -= digit;
                count++;
            }

            return fracStr.length > 0 ? `${intStr}.${fracStr}` : intStr;
        }

        function renderTwoLayerArithmeticMatrix(op1, op2, op, resultStr, base) {
            const maxLen = Math.max(op1.length, op2.length, resultStr.length) + 2;
            const padStr = (s, len) => s.padStart(len, ' ');

            let html = `
                <div class="text-xs text-slate-500 mb-2 border-b pb-1 font-bold">
                    Column Layout (Base ${base}):
                </div>
                <pre class="font-mono text-lg text-slate-800 leading-tight">
  ${padStr(op1, maxLen)}
<span class="text-emerald-600 font-bold">${op}</span> ${padStr(op2, maxLen - 2)}
<span class="text-slate-400">${'─'.repeat(maxLen + 2)}</span>
<span class="text-blue-600 font-extrabold">  ${padStr(resultStr, maxLen)}</span>
                </pre>
            `;
            twoLayerArithmeticBox.innerHTML = html;
        }

        /* Full Interactive Long Division with Subtraction Step-by-Step */
        function renderArithmeticLongDivision(op1, op2, base, decResult) {
            const cleanOp1 = op1.trim().toUpperCase();
            const cleanOp2 = op2.trim().toUpperCase();

            const dividendDec = parseToDecimal(cleanOp1, base);
            const divisorDec = parseToDecimal(cleanOp2, base);

            // Compute integer division steps
            let currentVal = 0;
            let quotientStr = "";
            let steps = [];

            for (let i = 0; i < cleanOp1.length; i++) {
                const char = cleanOp1[i];
                if (char === '.') continue;

                const digitVal = RADIX_CHARS.indexOf(char);
                currentVal = currentVal * base + digitVal;

                let qDigit = Math.floor(currentVal / divisorDec);
                let product = qDigit * divisorDec;
                let remainder = currentVal - product;

                steps.push({
                    broughtDigit: char,
                    currentVal: currentVal,
                    qDigit: RADIX_CHARS[qDigit],
                    product: product,
                    remainder: remainder
                });

                currentVal = remainder;
                quotientStr += RADIX_CHARS[qDigit];
            }

            // Remove leading zeroes from quotient display
            let cleanQuotient = decimalToTargetBase(decResult, base, 4);

            let html = `
                <div class="space-y-4">
                    <div class="text-xs font-bold text-slate-500 border-b pb-1">
                        Long Division Bracket & Subtractions (Base ${base}):
                    </div>

                    <!-- Long Division Visual Bracket -->
                    <div class="flex justify-center bg-white p-4 rounded-xl border border-amber-200">
                        <table class="long-div-table text-slate-800">
                            <tr>
                                <td></td>
                                <td></td>
                                <td class="text-blue-600 font-extrabold border-b-2 border-slate-700 text-left pl-1" colspan="6">${cleanQuotient}</td>
                            </tr>
                            <tr>
                                <td class="text-emerald-600 pr-1 font-extrabold">${cleanOp2}</td>
                                <td class="div-bracket pr-2"></td>
                                <td class="div-roof font-extrabold text-left pl-1" colspan="6">${cleanOp1}</td>
                            </tr>
            `;

            // Append each Subtraction step to table
            steps.forEach((st, idx) => {
                if (st.product > 0 || idx === steps.length - 1) {
                    let prodStr = decimalToTargetBase(st.product, base, 0);
                    let remStr = decimalToTargetBase(st.remainder, base, 0);
                    html += `
                        <tr>
                            <td></td>
                            <td></td>
                            <td class="text-red-500 font-bold text-right pr-1" colspan="2">− ${prodStr}</td>
                            <td colspan="4"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td></td>
                            <td class="minus-line font-extrabold text-emerald-600 text-right pr-1" colspan="2">${remStr}</td>
                            <td colspan="4"></td>
                        </tr>
                    `;
                }
            });

            html += `
                        </table>
                    </div>

                    <!-- Step-by-Step Subtraction Explanation Cards -->
                    <div class="space-y-2">
                        <div class="text-xs font-bold text-amber-900">🔍 Subtraction Breakdown Steps:</div>
            `;

            let tempCurrent = 0;
            cleanOp1.split('').forEach((ch, idx) => {
                if (ch === '.') return;
                let dVal = RADIX_CHARS.indexOf(ch);
                tempCurrent = tempCurrent * base + dVal;
                let qDigit = Math.floor(tempCurrent / divisorDec);
                let prod = qDigit * divisorDec;
                let rem = tempCurrent - prod;

                let curStr = decimalToTargetBase(tempCurrent, base, 0);
                let prodStr = decimalToTargetBase(prod, base, 0);
                let remStr = decimalToTargetBase(rem, base, 0);

                html += `
                    <div class="bg-white p-3 rounded-xl border border-amber-200 text-xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                            <span class="font-bold text-slate-700">Step ${idx + 1}:</span>
                            Bring down <b class="text-blue-600">'${ch}'</b> → Current Value = <b class="font-mono text-purple-700">${curStr}</b>
                        </div>
                        <div class="font-mono text-slate-800 bg-amber-50 px-2 py-1 rounded border border-amber-200">
                            <span class="text-red-600 font-bold">${curStr} − ${prodStr}</span> = <span class="text-emerald-600 font-extrabold">${remStr}</span> (Rem)
                        </div>
                    </div>
                `;

                tempCurrent = rem;
            });

            html += `</div></div>`;
            arithLongDivBox.innerHTML = html;
        }

        function updateArithmetic() {
            const srcBase = parseInt(arithSourceBase.value);
            const tgtBase = parseInt(arithTargetBase.value);
            const op1Str = operand1.value.trim();
            const op2Str = operand2.value.trim();

            matrixBaseLabel.innerText = `Base ${srcBase}`;
            arithTargetRadixBadge.innerText = `Base ${tgtBase}`;

            if (!isValidRadixNumber(op1Str, srcBase) || !isValidRadixNumber(op2Str, srcBase)) {
                arithResultValue.innerText = "INVALID INPUT";
                arithDecEquivalent.innerText = "Decimal: Error";
                twoLayerArithmeticBox.innerHTML = `<span class="text-red-500">Invalid digits for selected base!</span>`;
                arithLongDivBox.innerHTML = '';
                return;
            }

            const v1 = parseToDecimal(op1Str, srcBase);
            const v2 = parseToDecimal(op2Str, srcBase);

            let decResult = 0;
            if (selectedOperator === '+') decResult = v1 + v2;
            else if (selectedOperator === '-') decResult = v1 - v2;
            else if (selectedOperator === '*') decResult = v1 * v2;
            else if (selectedOperator === '/') {
                if (v2 === 0) {
                    arithResultValue.innerText = "DIV BY ZERO";
                    arithDecEquivalent.innerText = "Decimal: Undefined";
                    return;
                }
                decResult = v1 / v2;
            }

            const tgtResultStr = decimalToTargetBase(decResult, tgtBase, 6);
            const srcResultStr = decimalToTargetBase(decResult, srcBase, 6);

            arithResultValue.innerText = tgtResultStr;
            arithDecEquivalent.innerText = `Decimal Value: ${decResult}`;

            if (selectedOperator === '/') {
                solutionPanelTitle.innerText = "🧮 Long Division Layout & Subtractions";
                twoLayerArithmeticBox.classList.add('hidden');
                arithLongDivBox.classList.remove('hidden');
                renderArithmeticLongDivision(op1Str, op2Str, srcBase, decResult);
            } else {
                solutionPanelTitle.innerText = "📝 Vertical Alignment Work";
                arithLongDivBox.classList.add('hidden');
                twoLayerArithmeticBox.classList.remove('hidden');
                renderTwoLayerArithmeticMatrix(op1Str, op2Str, selectedOperator, srcResultStr, srcBase);
            }
        }

        initBaseOptions();
        arithSourceBase.addEventListener('change', updateArithmetic);
        arithTargetBase.addEventListener('change', updateArithmetic);
        operand1.addEventListener('input', updateArithmetic);
        operand2.addEventListener('input', updateArithmetic);

        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active-op'));
                e.target.classList.add('active-op');
                selectedOperator = e.target.getAttribute('data-op');
                updateArithmetic();
            });
        });

        copyArithResultBtn.addEventListener('click', () => {
            if (arithResultValue.innerText && !arithResultValue.innerText.includes('INVALID')) {
                navigator.clipboard.writeText(arithResultValue.innerText);
                alert('Copied answer to clipboard! 📋');
            }
        });

        updateArithmetic();
    </script>
</body>
</html>
