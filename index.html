<!DOCTYPE html>
<html>
<body>
<input id="v" placeholder="Value">
<select id="t"><option>Dec->All</option><option>Bin->Dec</option><option>Oct->Dec</option><option>Hex->Dec</option></select>
<button onclick="c()">Convert</button>
<p id="r"></p>
<script>
function c() {
  let v = document.getElementById('v').value, t = document.getElementById('t').value, r = '';
  if(t=='Dec->All') {
    let n = parseFloat(v);
    if(isNaN(n)) {r='Invalid';} else {
      r = `Bin: ${n.toString(2)}<br>Oct: ${n.toString(8)}<br>Hex: ${n.toString(16).toUpperCase()}`;
    }
  } else if(t=='Bin->Dec') r = parseInt(v, 2).toFixed(2);
    else if(t=='Oct->Dec') r = parseInt(v, 8).toFixed(2);
    else if(t=='Hex->Dec') r = parseInt(v, 16).toFixed(2);
  document.getElementById('r').innerHTML = isNaN(r)?'Invalid':r;
}
</script>
<style>body{background:#00008B;color:#fff;font-family:sans-serif;padding:20px}</style>
</body>
</html>
