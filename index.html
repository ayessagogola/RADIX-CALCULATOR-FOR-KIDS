<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number System Converter</title>
<style>
  body { background-color: #00008B; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  div { display: flex; flex-direction: column; gap: 10px; width: 250px; }
  input { padding: 8px; font-size: 16px; }
</style>
</head>
<body>
<div>
  <label>Decimal</label>
  <input type="number" step="any" id="dec" oninput="convert('dec')">
  <label>Boolean (Binary)</label>
  <input type="text" id="bin" oninput="convert('bin')">
  <label>Octal</label>
  <input type="text" id="oct" oninput="convert('oct')">
  <label>Hexadecimal</label>
  <input type="text" id="hex" oninput="convert('hex')">
</div>
<script>
function fmt(n) {
  return isNaN(n) ? "" : Number.isInteger(n) ? n : n.toFixed(2);
}
function convert(src) {
  let v = document.getElementById(src).value.trim();
  let d = NaN;
  if (src === 'dec') d = parseFloat(v);
  else if (src === 'bin') d = parseInt(v, 2);
  else if (src === 'oct') d = parseInt(v, 8);
  else if (src === 'hex') d = parseInt(v, 16);

  if (isNaN(d)) {
    ['dec','bin','oct','hex'].forEach(id => { if (id !== src) document.getElementById(id).value = ''; });
    return;
  }

  if (src !== 'dec') document.getElementById('dec').value = fmt(d);
  if (src !== 'bin') document.getElementById('bin').value = d.toString(2);
  if (src !== 'oct') document.getElementById('oct').value = d.toString(8);
  if (src !== 'hex') document.getElementById('hex').value = d.toString(16).toUpperCase();
}
</script>
</body>
</html>
