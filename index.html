<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Notepad - Base Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playful & Handwritten Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Gaegu:wght@400;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Fredoka', sans-serif;
            color: #2d3748;
        }

        .handwritten {
            font-family: 'Gaegu', cursive;
        }

        /* Lined Notebook Paper Effect */
        .notebook-page {
            background: #ffffff;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 100% 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-left: 3px solid #f87171; /* Red margin line */
            position: relative;
        }

        /* Spiral Ring Binding styling */
        .spiral-binding {
            position: absolute;
            top: 20px;
            left: -18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .ring {
            width: 32px;
            height: 14px;
            background: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%);
            border-radius: 10px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Input and Button Customization */
        input, select {
            border: 2px dashed #94a3b8 !important;
            background-color: #feffe7 !important;
            color: #1e293b !important;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none !important;
            border-color: #3b82f6 !important;
            border-style: solid !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2) !important;
        }

        .sticker-btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .sticker-btn:hover {
            transform: translateY(-2px) rotate(-1deg);
        }
        .sticker-btn:active {
            transform: translateY(1px) rotate(0deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6">

    <div class="max-w-5xl mx-auto">
        <!-- Top Navigation Tabs (Notebook Pages) -->
        <div class="flex items-center gap-3 ml-6 mb-[-2px] relative z-20">
            <a href="page1_converter.html" class="bg-white border-2 border-b-0 border-slate-300 px-6 py-3 rounded-t-2xl font-bold text-blue-600 shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-pencil text-amber-500"></i> Page 1: Base Converter
            </a>
            <a href="page2_arithmetic.html" class="bg-slate-200 border-2 border-b-0 border-slate-300 px-6 py-3 rounded-t-2xl font-bold text-slate-600 hover:bg-slate-100 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-calculator text-emerald-500"></i> Page 2: Math Solver
            </a>
        </div>

        <!-- Main Notebook Page -->
        <div class="notebook-page rounded-2xl rounded-tl-none p-6 md:p-10 pl-10 md:pl-16 border-2 border-slate-300">
            
            <!-- Spiral Binding Visuals -->
            <div class="spiral-binding hidden sm:flex">
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
            </div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b-2 border-blue-200 pb-4 mb-6 gap-4">
                <div>
                    <span class="inline-block bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-1">
                        ✏️ Class Notes
                    </span>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 flex items-center gap-3">
                        Base Number Converter! 🚀
                    </h1>
                </div>

                <!-- Precision Control -->
                <div class="flex items-center gap-2 bg-yellow-100 border-2 border-yellow-300 px-3 py-1.5 rounded-xl text-sm font-semibold text-yellow-900">
                    <i class="fa-solid fa-sliders"></i>
                    <label for="precisionSelect">Decimals:</label>
                    <select id="precisionSelect" class="bg-white rounded px-2 py-0.5 text-slate-700 font-bold">
                        <option value="4">4 places</option>
                        <option value="8" selected>8 places</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left Column: Inputs -->
                <div class="lg:col-span-5 space-y-6">
                    <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-5 space-y-4">
                        <div>
                            <label for="inputValue" class="block text-sm font-bold text-sky-900 mb-1">
                                📝 Type Your Number:
                            </label>
                            <input type="text" id="inputValue" value="10101110.101" 
                                class="w-full px-4 py-3 rounded-xl font-mono text-xl text-slate-800 shadow-inner" placeholder="e.g. 10101">
                            <div id="errorMessage" class="hidden text-xs text-red-500 font-bold mt-1.5 flex items-center gap-1">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <span id="errorText">Invalid digit for this base!</span>
                            </div>
                        </div>

                        <!-- Base Selectors -->
                        <div class="grid grid-cols-1 gap-3">
                            <div>
                                <label for="sourceBase" class="block text-xs font-bold text-slate-600 mb-1">Start Base (From):</label>
                                <select id="sourceBase" class="w-full px-3 py-2 rounded-xl text-sm font-bold text-slate-700 cursor-pointer"></select>
                            </div>

                            <div class="flex justify-center">
                                <button id="swapBasesBtn" class="sticker-btn bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-sm border-2 border-amber-500">
                                    <i class="fa-solid fa-arrows-rotate"></i> Swap Bases
                                </button>
                            </div>

                            <div>
                                <label for="targetBase" class="block text-xs font-bold text-slate-600 mb-1">Target Base (To):</label>
                                <select id="targetBase" class="w-full px-3 py-2 rounded-xl text-sm font-bold text-slate-700 cursor-pointer"></select>
                            </div>
                        </div>

                        <!-- Presets -->
                        <div class="pt-2 border-t border-sky-200">
                            <span class="text-xs font-bold text-sky-800 block mb-2">Quick Base Buttons:</span>
                            <div class="grid grid-cols-4 gap-1.5">
                                <button class="conv-preset sticker-btn bg-white border border-sky-300 hover:bg-sky-100 text-sky-800 text-xs py-1.5 rounded-lg font-bold" data-base="2">2 (BIN)</button>
                                <button class="conv-preset sticker-btn bg-white border border-sky-300 hover:bg-sky-100 text-sky-800 text-xs py-1.5 rounded-lg font-bold" data-base="8">8 (OCT)</button>
                                <button class="conv-preset sticker-btn bg-white border border-sky-300 hover:bg-sky-100 text-sky-800 text-xs py-1.5 rounded-lg font-bold" data-base="10">10 (DEC)</button>
                                <button class="conv-preset sticker-btn bg-white border border-sky-300 hover:bg-sky-100 text-sky-800 text-xs py-1.5 rounded-lg font-bold" data-base="16">16 (HEX)</button>
                            </div>
                        </div>
                    </div>

                    <!-- Output Box -->
                    <div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-5 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-emerald-800 uppercase tracking-wider">🎉 Final Answer:</span>
                            <span id="targetRadixBadge" class="bg-emerald-200 text-emerald-900 font-bold text-xs px-2.5 py-0.5 rounded-full">Base 10</span>
                        </div>
                        <div class="bg-white border-2 border-emerald-200 rounded-xl p-4 flex items-center justify-between">
                            <div id="outputValue" class="font-mono text-2xl font-extrabold text-emerald-600 break-all">--</div>
                            <button id="copyResultBtn" class="sticker-btn bg-emerald-500 hover:bg-emerald-600 text-white p-2.5 rounded-lg text-xs" title="Copy Answer">
                                <i class="fa-regular fa-copy text-base"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Interactive Solution -->
                <div class="lg:col-span-7 space-y-6">
                    <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-5 space-y-4">
                        <div class="flex items-center justify-between border-b border-purple-200 pb-2">
                            <h3 class="font-bold text-purple-900 text-sm flex items-center gap-2">
                                🌟 Step-by-Step Breakdown
                            </h3>
                            <span class="text-xs text-purple-600 font-semibold">How it works</span>
                        </div>

                        <!-- Arrow Solution Box -->
                        <div id="arrowSolutionContainer" class="overflow-x-auto min-h-[180px] font-mono text-xs">
                            <!-- Populated dynamically -->
                        </div>

                        <!-- Positional Addition Box -->
                        <div id="positionalSumBox" class="hidden p-4 rounded-xl bg-white border border-purple-200 space-y-2">
                            <div class="text-xs font-bold text-purple-800 border-b pb-1">
                                Summing Up the Values:
                            </div>
                            <div id="verticalPositionalSumList" class="space-y-1 text-xs text-slate-700"></div>
                        </div>
                    </div>

                    <!-- Long Division Box -->
                    <div class="bg-orange-50 border-2 border-orange-200 rounded-2xl p-5 space-y-3">
                        <div class="border-b border-orange-200 pb-2">
                            <h3 class="font-bold text-orange-900 text-sm flex items-center gap-2">
                                🧮 Conversion Steps (Division & Multiplication)
                            </h3>
                        </div>
                        <div id="longDivisionContainer" class="space-y-4 overflow-y-auto max-h-[300px] text-xs"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const RADIX_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const inputValue = document.getElementById('inputValue');
        const outputValue = document.getElementById('outputValue');
        const sourceBase = document.getElementById('sourceBase');
        const targetBase = document.getElementById('targetBase');
        const swapBasesBtn = document.getElementById('swapBasesBtn');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const targetRadixBadge = document.getElementById('targetRadixBadge');
        const precisionSelect = document.getElementById('precisionSelect');
        const arrowSolutionContainer = document.getElementById('arrowSolutionContainer');
        const positionalSumBox = document.getElementById('positionalSumBox');
        const verticalPositionalSumList = document.getElementById('verticalPositionalSumList');
        const longDivisionContainer = document.getElementById('longDivisionContainer');

        function initBaseOptions() {
            for (let b = 2; b <= 36; b++) {
                let label = `Base ${b}`;
                if (b === 2) label += " (Binary)";
                else if (b === 8) label += " (Octal)";
                else if (b === 10) label += " (Decimal)";
                else if (b === 16) label += " (Hexadecimal)";

                sourceBase.add(new Option(label, b));
                targetBase.add(new Option(label, b));
            }
            sourceBase.value = 2;
            targetBase.value = 10;
        }

        function isValidRadixNumber(str, base) {
            if (!str) return true;
            const clean = str.trim().toUpperCase();
            const allowedDigits = RADIX_CHARS.slice(0, base);
            let dotCount = 0;
            for (let i = 0; i < clean.length; i++) {
                const ch = clean[i];
                if (ch === '.') {
                    dotCount++;
                    if (dotCount > 1) return false;
                } else if (!allowedDigits.includes(ch)) {
                    return false;
                }
            }
            return true;
        }

        function parseToDecimal(str, base) {
            if (!str) return 0;
            const clean = str.trim().toUpperCase();
            const parts = clean.split('.');
            let intPart = parts[0] || '0';
            let fracPart = parts[1] || '';

            let intVal = 0;
            for (let i = 0; i < intPart.length; i++) {
                intVal = intVal * base + RADIX_CHARS.indexOf(intPart[i]);
            }

            let fracVal = 0;
            for (let i = fracPart.length - 1; i >= 0; i--) {
                fracVal = (fracVal + RADIX_CHARS.indexOf(fracPart[i])) / base;
            }

            return intVal + fracVal;
        }

        function decimalToTargetBase(decimalValue, targetBaseVal, maxFracDigits = 8) {
            if (isNaN(decimalValue)) return "0";
            let val = Math.abs(decimalValue);
            let intPart = Math.floor(val);
            let fracPart = val - intPart;

            let intStr = "";
            if (intPart === 0) intStr = "0";
            else {
                let temp = intPart;
                while (temp > 0) {
                    intStr = RADIX_CHARS[temp % targetBaseVal] + intStr;
                    temp = Math.floor(temp / targetBaseVal);
                }
            }

            let fracStr = "";
            let count = 0;
            let fracTemp = fracPart;
            while (fracTemp > 0 && count < maxFracDigits) {
                fracTemp *= targetBaseVal;
                let digit = Math.floor(fracTemp);
                fracStr += RADIX_CHARS[digit];
                fracTemp -= digit;
                count++;
            }

            return fracStr.length > 0 ? `${intStr}.${fracStr}` : intStr;
        }

        function renderPositionalArrowSolution(str, base, decResult) {
            arrowSolutionContainer.innerHTML = '';
            verticalPositionalSumList.innerHTML = '';

            if (!str) return;

            const clean = str.trim().toUpperCase();
            const parts = clean.split('.');
            const intPart = parts[0] || '0';
            const fracPart = parts[1] || '';

            const digitEntries = [];
            for (let i = 0; i < intPart.length; i++) {
                digitEntries.push({ char: intPart[i], digitVal: RADIX_CHARS.indexOf(intPart[i]), power: intPart.length - 1 - i, isFrac: false });
            }
            for (let i = 0; i < fracPart.length; i++) {
                digitEntries.push({ char: fracPart[i], digitVal: RADIX_CHARS.indexOf(fracPart[i]), power: -(i + 1), isFrac: true });
            }

            const totalDigits = digitEntries.length;
            const formattedDecVal = decResult.toString();

            const charWidth = 28;
            const startX = 20;
            const rowHeight = 34;
            const topMargin = 60;
            const minSvgWidth = Math.max(totalDigits * charWidth + 240, 450);
            const svgHeight = topMargin + totalDigits * rowHeight + 40;

            let svgContent = `
                <svg width="${minSvgWidth}" height="${svgHeight}" style="background: transparent;" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                            <path d="M 0 0 L 8 4 L 0 8 z" fill="#8b5cf6" />
                        </marker>
                    </defs>
                    <text x="${startX}" y="28" fill="#6b21a8" font-size="16" font-weight="bold">
                        ${clean} (Base ${base}) → ${formattedDecVal} (Base 10)
                    </text>
            `;

            let charPosMap = [];
            let currentX = startX;

            for (let i = 0; i < intPart.length; i++) {
                const charX = currentX + charWidth / 2;
                charPosMap.push(charX);
                svgContent += `<text x="${charX}" y="${topMargin - 15}" fill="#3b82f6" font-size="16" font-weight="extrabold" text-anchor="middle">${intPart[i]}</text>`;
                currentX += charWidth;
            }

            if (fracPart.length > 0) {
                svgContent += `<text x="${currentX + 8}" y="${topMargin - 15}" fill="#eab308" font-size="18" font-weight="bold" text-anchor="middle">.</text>`;
                currentX += 18;
                for (let i = 0; i < fracPart.length; i++) {
                    const charX = currentX + charWidth / 2;
                    charPosMap.push(charX);
                    svgContent += `<text x="${charX}" y="${topMargin - 15}" fill="#3b82f6" font-size="16" font-weight="extrabold" text-anchor="middle">${fracPart[i]}</text>`;
                    currentX += charWidth;
                }
            }

            let drawOrder = [];
            for (let i = digitEntries.length - 1; i >= 0; i--) if (digitEntries[i].isFrac) drawOrder.push(i);
            for (let i = digitEntries.length - 1; i >= 0; i--) if (!digitEntries[i].isFrac) drawOrder.push(i);

            let sumProductsList = [];

            drawOrder.forEach((entryIdx, rowIdx) => {
                const entry = digitEntries[entryIdx];
                const digitX = charPosMap[entryIdx];
                const targetY = topMargin + (rowIdx + 1) * rowHeight;
                const rightX = currentX + 15;

                const prodVal = entry.digitVal * Math.pow(base, entry.power);
                sumProductsList.push({ val: prodVal, digitChar: entry.char, power: entry.power });

                svgContent += `<path d="M ${digitX} ${topMargin - 5} V ${targetY} H ${rightX - 10}" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)" />`;

                let formulaStr = `${entry.digitVal} × ${base}<tspan font-size="10" dy="-5">${entry.power}</tspan><tspan dy="5"></tspan>`;
                svgContent += `<text x="${rightX}" y="${targetY + 4}" fill="#475569" font-size="12" font-weight="bold">${formulaStr} = </text>`;
                svgContent += `<text x="${minSvgWidth - 60}" y="${targetY + 4}" fill="#10b981" font-size="13" font-weight="bold" text-anchor="end">${prodVal}</text>`;
            });

            svgContent += `</svg>`;
            arrowSolutionContainer.innerHTML = svgContent;

            let sumHTML = '';
            sumProductsList.forEach((item) => {
                sumHTML += `<div class="flex justify-between border-b border-slate-100 pb-0.5">
                    <span class="text-slate-500">(${item.digitChar} × ${base}<sup>${item.power}</sup>)</span>
                    <span class="text-emerald-600 font-bold">${item.val}</span>
                </div>`;
            });
            sumHTML += `<div class="flex justify-between pt-1 text-purple-900 font-extrabold border-t border-purple-200">
                <span>Total:</span>
                <span>${formattedDecVal}</span>
            </div>`;

            verticalPositionalSumList.innerHTML = sumHTML;
            positionalSumBox.classList.remove('hidden');
        }

        function renderLongDivisionSteps(decVal, targetBaseVal, precision = 8) {
            longDivisionContainer.innerHTML = '';
            let intVal = Math.floor(Math.abs(decVal));
            let fracVal = Math.abs(decVal) - intVal;

            let intHTML = `
                <div class="space-y-1">
                    <div class="font-bold text-orange-900">1. Divide Whole Numbers (÷ ${targetBaseVal}):</div>
                    <div class="bg-white p-3 rounded-xl border border-orange-200 space-y-1 font-mono">
            `;

            let tempInt = intVal;
            let remainders = [];

            if (tempInt === 0) {
                intHTML += `<div>0 ÷ ${targetBaseVal} = 0 (Rem: <b class="text-emerald-600">0</b>)</div>`;
                remainders.push("0");
            } else {
                while (tempInt > 0) {
                    let quot = Math.floor(tempInt / targetBaseVal);
                    let rem = tempInt % targetBaseVal;
                    let remChar = RADIX_CHARS[rem];
                    remainders.push(remChar);
                    intHTML += `<div class="flex justify-between"><span>${tempInt} ÷ ${targetBaseVal} = ${quot}</span> <span class="text-amber-600 font-bold">Remainder: ${remChar}</span></div>`;
                    tempInt = quot;
                }
            }

            intHTML += `<div class="pt-1 font-bold text-emerald-600 border-t mt-1">Whole Part = ${remainders.reverse().join('')}</div></div></div>`;

            let fracHTML = '';
            if (fracVal > 0) {
                fracHTML = `
                    <div class="space-y-1">
                        <div class="font-bold text-orange-900">2. Multiply Decimal Parts (× ${targetBaseVal}):</div>
                        <div class="bg-white p-3 rounded-xl border border-orange-200 space-y-1 font-mono">
                `;
                let tempFrac = fracVal;
                let fracDigits = [];
                let count = 0;

                while (tempFrac > 0 && count < precision) {
                    let prod = tempFrac * targetBaseVal;
                    let intDigit = Math.floor(prod);
                    let remFrac = prod - intDigit;
                    let digitChar = RADIX_CHARS[intDigit];
                    fracDigits.push(digitChar);

                    fracHTML += `<div class="flex justify-between"><span>${tempFrac.toFixed(3)} × ${targetBaseVal} = ${prod.toFixed(3)}</span> <span class="text-amber-600 font-bold">Integer: ${digitChar}</span></div>`;
                    tempFrac = remFrac;
                    count++;
                }
                fracHTML += `<div class="pt-1 font-bold text-emerald-600 border-t mt-1">Fraction Part = .${fracDigits.join('')}</div></div></div>`;
            }

            longDivisionContainer.innerHTML = intHTML + fracHTML;
        }

        function updateConverter() {
            const rawVal = inputValue.value;
            const srcBase = parseInt(sourceBase.value);
            const tgtBase = parseInt(targetBase.value);
            const prec = parseInt(precisionSelect.value);

            targetRadixBadge.innerText = `Base ${tgtBase}`;

            if (!isValidRadixNumber(rawVal, srcBase)) {
                errorMessage.classList.remove('hidden');
                outputValue.innerText = "ERROR";
                arrowSolutionContainer.innerHTML = `<span class="text-red-500">Invalid input value for selected base!</span>`;
                positionalSumBox.classList.add('hidden');
                longDivisionContainer.innerHTML = '';
                return;
            }

            errorMessage.classList.add('hidden');

            if (!rawVal.trim()) {
                outputValue.innerText = "--";
                arrowSolutionContainer.innerHTML = `<span class="text-slate-400">Enter a number above to start!</span>`;
                positionalSumBox.classList.add('hidden');
                longDivisionContainer.innerHTML = '';
                return;
            }

            const decVal = parseToDecimal(rawVal, srcBase);
            const targetResultStr = decimalToTargetBase(decVal, tgtBase, prec);

            outputValue.innerText = targetResultStr;
            renderPositionalArrowSolution(rawVal, srcBase, decVal);
            renderLongDivisionSteps(decVal, tgtBase, prec);
        }

        initBaseOptions();
        inputValue.addEventListener('input', updateConverter);
        sourceBase.addEventListener('change', updateConverter);
        targetBase.addEventListener('change', updateConverter);
        precisionSelect.addEventListener('change', updateConverter);

        swapBasesBtn.addEventListener('click', () => {
            const temp = sourceBase.value;
            sourceBase.value = targetBase.value;
            targetBase.value = temp;
            updateConverter();
        });

        document.querySelectorAll('.conv-preset').forEach(btn => {
            btn.addEventListener('click', (e) => {
                targetBase.value = e.target.getAttribute('data-base');
                updateConverter();
            });
        });

        copyResultBtn.addEventListener('click', () => {
            if (outputValue.innerText && outputValue.innerText !== '--') {
                navigator.clipboard.writeText(outputValue.innerText);
                alert('Copied answer to clipboard! 📋');
            }
        });

        updateConverter();
    </script>
</body>
</html>
