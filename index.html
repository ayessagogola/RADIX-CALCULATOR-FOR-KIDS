
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top Radix Calculator</title>
<style>
body{background:#000033;color:white;font-family:sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
.container{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.box{display:flex;flex-direction:column;gap:10px;width:250px}
input,select,button{padding:8px;font-size:16px}
h3{margin:0 0 5px;font-size:18px;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.keypad button{padding:10px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="container">

<!-- Conversion Calculator -->
<div class="box">
<h3>Conversion Calculator</h3>
<input type="text" id="val" placeholder="Enter value">
<select id="from">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="8">Octal</option>
<option value="16">Hexadecimal</option>
</select>
<select id="to">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="8">Octal</option>
<option value="16">Hexadecimal</option>
</select>
<button onclick="convert()">Convert</button>
<div id="res"></div>
</div>

<!-- Addition Calculator -->
<div class="box">
<h3>Addition Calculator</h3>
<input type="text" id="val1" placeholder="Enter value 1">
<select id="base1">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="8">Octal</option>
<option value="16">Hexadecimal</option>
</select>
<input type="text" id="val2" placeholder="Enter value 2">
<select id="base2">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="8">Octal</option>
<option value="16">Hexadecimal</option>
</select>
<select id="toAdd">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="8">Octal</option>
<option value="16">Hexadecimal</option>
</select>
<button onclick="addNums()">Add</button>
<div id="resAdd"></div>
</div>

<!-- Boolean Calculator -->
<div class="box">
<h3>Boolean Calculator</h3>
<input type="text" id="boolExpr" placeholder="Expression e.g. A+B*!C">
<div class="keypad">
<button onclick="insertKey('A')">A</button>
<button onclick="insertKey('B')">B</button>
<button onclick="insertKey('C')">C</button>
<button onclick="insertKey('!')">!</button>
<button onclick="insertKey('+')">+</button>
<button onclick="insertKey('*')">*</button>
<button onclick="insertKey('(')">(</button>
<button onclick="insertKey(')')">)</button>
<button onclick="delKey()">DEL</button>
</div>
<button onclick="calcBool()">Evaluate</button>
<div id="resBool"></div>
</div>
</div>

<script>

// Conversion Calculator
function convert(){
let v=document.getElementById('val').value.trim();
let f=+document.getElementById('from').value;
let t=+document.getElementById('to').value;
let valid={2:/^[01]+$/,8:/^[0-7]+$/,10:/^\d+$/,16:/^[0-9a-f]+$/i};
if(!valid[f].test(v)){
document.getElementById('res').innerText="Invalid";
return;
}
let d=parseInt(v,f);
document.getElementById('res').innerText="Result: "+d.toString(t).toUpperCase();
}

// Addition Calculator
function addNums(){
let v1=document.getElementById('val1').value.trim();
let v2=document.getElementById('val2').value.trim();
let b1=+document.getElementById('base1').value;
let b2=+document.getElementById('base2').value;
let t=+document.getElementById('toAdd').value;
let valid={2:/^[01]+$/,8:/^[0-7]+$/,10:/^\d+$/,16:/^[0-9a-f]+$/i};
if(!valid[b1].test(v1)||!valid[b2].test(v2)){
document.getElementById('resAdd').innerText="Invalid";
return;
}
let sum=parseInt(v1,b1)+parseInt(v2,b2);
document.getElementById('resAdd').innerText="Result: "+sum.toString(t).toUpperCase();
}

// Boolean Keypad
function insertKey(k){
document.getElementById('boolExpr').value+=k;
}
function delKey(){
let input=document.getElementById('boolExpr');
input.value=input.value.slice(0,-1);
}

// Boolean Simplification
function calcBool(){
let expr=document.getElementById('boolExpr').value.trim();
let output=document.getElementById('resBool');

try{
if(!expr||!/^[ABCabc!+*()\s]+$/.test(expr))throw Error();

let js=expr.toUpperCase().replace(/\+/g,'||').replace(/\*/g,'&&');
let vars=['A','B','C'],minterms=[];

// Evaluate all combinations
for(let a of [0,1])
for(let b of [0,1])
for(let c of [0,1]){
let A=!!a,B=!!b,C=!!c;
let result=Function('A','B','C','return ('+js+')')(A,B,C);
if(result)minterms.push(''+a+b+c);
}

// Constant results
if(minterms.length===0){
output.innerText="Result: FALSE";
return;
}
if(minterms.length===8){
output.innerText="Result: TRUE";
return;
}

// Generate valid Boolean groups
let cubes=[];
for(let x of ['0','1','-'])
for(let y of ['0','1','-'])
for(let z of ['0','1','-']){
let p=x+y+z,covered=[];
for(let a of [0,1])
for(let b of [0,1])
for(let c of [0,1]){
let bits=''+a+b+c;
if([0,1,2].every(i=>p[i]==='-'||p[i]===bits[i])){
if(minterms.includes(bits))covered.push(bits);
else covered=[];
}}
let matches=[];
for(let a of [0,1])
for(let b of [0,1])
for(let c of [0,1]){
let bits=''+a+b+c;
if([0,1,2].every(i=>p[i]==='-'||p[i]===bits[i]))matches.push(bits);
}
if(matches.every(m=>minterms.includes(m))){
cubes.push({p,covered:matches,count:[...p].filter(v=>v!=='-').length});
}
}

// Find the simplest expression
let best=null,target=new Set(minterms);
function search(chosen,covered){
if([...target].every(m=>covered.has(m))){
let score=[chosen.length,chosen.reduce((s,c)=>s+c.count,0)];
if(!best||score[0]<best.score[0]||(score[0]===best.score[0]&&score[1]<best.score[1]))
best={chosen:[...chosen],score};
return;
}
if(best&&chosen.length>=best.score[0])return;
let missing=[...target].find(m=>!covered.has(m));
for(let cube of cubes){
if(!cube.covered.includes(missing)||chosen.includes(cube))continue;
let next=new Set(covered);
cube.covered.forEach(m=>next.add(m));
search([...chosen,cube],next);
}
}
search([],new Set());

// Convert groups into Boolean expressions
function makeExpression(p){
let result=[];
[...p].forEach((v,i)=>{
if(v==='1')result.push(vars[i]);
if(v==='0')result.push('!'+vars[i]);
});
return result.join('*');
}

let answer=best.chosen.map(c=>makeExpression(c.p)).join(' + ');
output.innerText="Result: "+answer;

}catch(e){
output.innerText="Invalid Expression";
}
}
</script>
</body>
</html>
